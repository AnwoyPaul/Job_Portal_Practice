<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
</head>
<body>

    <h1>Login</h1>

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        {{ form.as_p }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit">Login</button>
    </form>

    <a href="{% url 'signup' %}">Create an account</a>

</body>
</html>
