<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign up</title>
</head>
<body>

    <h1>Create an Account</h1>

    <form method="post" action="{% url 'signup' %}">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Sign up</button>
    </form>

    <a href="{% url 'login' %}">
        Already have an account? Log in
    </a>

</body>
</html>
